# The gate the way it runs locally, `just verify`, split in two jobs. The
# `verify` job runs every recipe of it but `timing`, in its order (format,
# clippy, every test with coverage, doctests, rustdoc, the shell guard without
# its inline reader, and the dependency gates for bans, licences and sources),
# over the whole workspace: none of them reads a clock, so its answer is the
# same on every machine. The `timing` job runs `just timing` alone, the tests
# that read the clock, on a runner of its own; it is advisory for now, while
# its rows are measured on GitHub's runner. Those two run on Linux. The
# crates are Rust with no platform code of their own, but the grammars are C,
# compiled by each system's C compiler (MSVC on Windows, Apple's clang on
# macOS), and a caller builds them on its own system: the `test` job runs
# `just test` on Windows and on macOS, so a caller there is not the first to
# build and test them. It is advisory for now (below). The `oldest-rust` job
# runs `just oldest-rust` on Linux: the crates built and tested with the
# oldest Rust they support (`rust-version` in Cargo.toml), where every other
# job uses the pinned one. It is advisory for now too. This is a library:
# nothing here produces an artefact. Advisories are their own job, running
# `just advisories`, because they change without a commit and must not be
# confused with a code failure; the verify job does not run them.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels the run still going for the old one.
# A run on `main` is never cancelled: every commit there keeps its own verify
# job, which the release workflow asks for before it publishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: no job writes to the repo.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Outranks rust-toolchain.toml, which the install action's `rustup default`
  # would otherwise silently lose. Keep this, the `toolchain:` input of each
  # Rust install step and rust-toolchain.toml on the same version (a test
  # checks all of them). The `oldest-rust` job alone overrides it, with the
  # oldest supported Rust.
  RUSTUP_TOOLCHAIN: "1.99.1"
  # No debuginfo: linking every test binary with full debuginfo starves the
  # runner on cold builds. Test failures still name the assertion.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Actions are pinned to commit SHAs so a moved tag cannot change what
      # runs here; dtolnay/rust-toolchain therefore needs the explicit
      # `toolchain:` input.
      - name: Install the pinned Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov and cargo-deny
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-llvm-cov,cargo-deny

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: "epoch-${{ vars.RUST_CACHE_EPOCH || '1' }}"
          cache-on-failure: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      # Every recipe of `just verify` but `timing`, in its order
      # (`crates/guards/tests/ci_jobs.rs` checks it).
      - run: just format-check lint coverage doc-test doc no-inline deny
        timeout-minutes: 50

  timing:
    name: timing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install the pinned Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: "1.99.1"

      # The cache key carries the job's name, so this job's optimized build
      # and the verify job's builds are kept apart.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: "epoch-${{ vars.RUST_CACHE_EPOCH || '1' }}"
          cache-on-failure: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      - run: just timing
        timeout-minutes: 20

  # Every test but the timing ones, doctests included, on Windows and on
  # macOS: `just test`, a debug build with every feature, `--locked`, without
  # coverage (the verify job measures it, on Linux). No test it runs reads a
  # clock, so a slow runner cannot fail it. Advisory for now: the ruleset on
  # `main` does not require it, so a red run here is a time to look, not a
  # change that cannot merge. Its two checks, `test (windows-latest)` and
  # `test (macos-latest)`, are added to the ruleset's required checks once
  # they have passed on `main` steadily, with their time on these runners
  # known.
  test:
    name: test (${{ matrix.os }})
    strategy:
      # One system failing does not cancel the other: each answers for itself.
      fail-fast: false
      matrix:
        # Today `windows-latest` is x86_64 (Windows Server 2025, MSVC) and
        # `macos-latest` is arm64 (macOS 26, Apple silicon); Linux is
        # x86_64, in the jobs above. These are three of the four targets
        # deny.toml audits; x86_64 macOS is not run.
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # `.gitattributes` keeps every text file LF on Windows too: the tests
      # compare the case files and the sources as text.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # `just test` needs no component: no clippy, rustfmt or llvm-tools.
      - name: Install the pinned Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: "1.99.1"

      # The cache key carries the job's name and rustc's host, so each
      # system's build is kept apart, and apart from the other jobs.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: "epoch-${{ vars.RUST_CACHE_EPOCH || '1' }}"
          cache-on-failure: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      # just runs a recipe's lines with `sh`, on Windows too: the runner has
      # Git for Windows' `sh` on its PATH (`crates/guards/tests/ci_jobs.rs`
      # checks the job runs this recipe alone).
      - run: just test
        timeout-minutes: 45

  # `just oldest-rust` on Linux: what a caller builds of the crates, and
  # every test but the timing ones, with the oldest Rust they support,
  # `rust-version` in Cargo.toml, against Cargo.lock. Clippy's `incompatible_msrv` catches an API newer than it
  # in the verify job, but not a language feature, nor a dependency that asks
  # for a newer Rust; this build does. It is the one job that installs
  # another Rust than rust-toolchain.toml's. Advisory for now: the ruleset on
  # `main` does not require it, so a red run here is a time to look, not a
  # change that cannot merge. It is to become a required check: `oldest-rust`
  # is added to the ruleset's required checks once it has passed on `main`
  # steadily. Until then a release runs `just oldest-rust` by hand
  # (CONTRIBUTING.md, Releasing), since release.yml builds with the pinned
  # Rust only.
  oldest-rust:
    name: oldest-rust
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Outranks the workflow's RUSTUP_TOOLCHAIN for this job alone, so every
    # step reads the Rust it installs, rust-cache's key included; the recipe
    # names it too (`cargo +…`). A test holds this and the `toolchain:`
    # input below to `rust-version`, and refuses such an override in any
    # other job.
    env:
      RUSTUP_TOOLCHAIN: "1.90"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # `just oldest-rust` needs no component: no clippy, rustfmt or
      # llvm-tools.
      - name: Install the oldest supported Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: "1.90"

      # The cache key carries the job's name and the version of rustc, so
      # this compiler's build is kept apart from the pinned one's.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: "epoch-${{ vars.RUST_CACHE_EPOCH || '1' }}"
          cache-on-failure: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      # `crates/guards/tests/ci_jobs.rs` checks the job runs this recipe
      # alone.
      - run: just oldest-rust
        timeout-minutes: 45

  advisories:
    name: advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # cargo-deny reads the dependency graph through cargo, so it needs the
      # same pinned Rust as the verify job.
      - name: Install the pinned Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: "1.99.1"

      - name: Install cargo-deny
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-deny

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      - run: just advisories
