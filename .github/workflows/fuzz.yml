# The fuzz targets of `tools/fuzz`, each run for five minutes, once a week
# and when started by hand: `just fuzz <target> 300`, one job for each
# target. Not a required check, and not part of the gate: what a run finds
# depends on how long it runs, and the gate holds the same promises on
# every change in `crates/guards/tests/promises.rs`. A target is seeded
# from the case files, built by cargo-fuzz with the nightly that
# `tools/fuzz/rust-toolchain.toml` names (installed beside the pinned Rust,
# which builds and runs the runner), and run under libFuzzer.
#
# What a run finds is a security report (SECURITY.md): the runner prints
# none of what libFuzzer prints, which names the input, and keeps it in a
# log beside the input, so nothing of it reaches this public log. A run
# that finds something fails, and its last step keeps that folder as an
# artifact of the run, for a maintainer to download and report privately;
# anyone who can read the repository can download it, so it is kept for
# three days only.
name: Fuzz

on:
  schedule:
    # Mondays, 04:17 UTC.
    - cron: "17 4 * * 1"
  workflow_dispatch:

# One run at a time; a run started by hand does not cancel the weekly one.
concurrency:
  group: fuzz
  cancel-in-progress: false

# Least privilege: no job writes to the repo.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # As in ci.yml: outranks rust-toolchain.toml, and a test keeps it, each
  # `toolchain:` input below and rust-toolchain.toml on the same version,
  # but the input that installs the fuzzing nightly, which the test holds to
  # `tools/fuzz/rust-toolchain.toml`.
  RUSTUP_TOOLCHAIN: "1.99.1"

jobs:
  # `crates/guards/tests/ci_jobs.rs` checks the job runs `just fuzz` alone,
  # once for each target of `tools/fuzz/Cargo.toml`, and keeps what it
  # found only when it fails.
  fuzz:
    name: fuzz (${{ matrix.target }})
    strategy:
      # One target finding something does not stop the others.
      fail-fast: false
      matrix:
        target: [shell_posix, shell_powershell, shell_cmd, file, url, url_address, secrets, code, script]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # The runner, and the lints and tests of the tool, build with it.
      - name: Install the pinned Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      # The fuzz targets build with it, named by the runner.
      - name: Install the fuzzing nightly
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: "nightly-2026-11-10"

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-fuzz@0.13.2

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      - run: just fuzz ${{ matrix.target }} 300
        timeout-minutes: 30

      # Only when the run failed: the inputs it found and the log, never
      # printed here.
      - name: Keep what the run found, for a private report
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: found-${{ matrix.target }}
          path: target/fuzz/found/${{ matrix.target }}
          retention-days: 3
          if-no-files-found: ignore
