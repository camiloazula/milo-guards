[package]
name = "milo-guards-code"
description = "Reads Python, JavaScript and Ruby code and says what it is certain to do to files and what it runs, or that it does not understand it."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
# The case files are the tests' input, read at test time from the
# repository; a published crate does not carry them.
exclude = ["tests/cases/"]

[lints]
workspace = true

[features]
default = ["ruby"]
# Reads Ruby, with tree-sitter-ruby. Off, `Language::Ruby` is still there
# and no Ruby code is read: `read` gives an `Unread` alone and `understand`
# says not understood, and the grammar is not built.
ruby = ["dep:tree-sitter-ruby"]
# What only the reader's own tests read: the count of the work its parses
# do for a call (`REPORT_BYTES` in `src/unit.rs`). Its tests turn it on,
# through the dev-dependency on this crate below. It is not for callers and
# not part of the API (hidden from the docs): it may change or go without
# notice.
testing = []

[dependencies]
# The grammars and the runtime they share: the workspace manifest holds the
# runtime at 0.26 and says why. They are this crate's "own parsers".
tree-sitter.workspace = true
tree-sitter-python.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-ruby = { workspace = true, optional = true }

[dev-dependencies]
# This crate with `testing` on, so every build of its tests reads the count
# of the work its parses do (`tests/parse_budget.rs`).
milo-guards-code = { path = ".", features = ["testing"] }
