[package]
name = "milo-guards"
description = "Guards for AI coding agents on your own machine: each reads what an agent is about to do and says whether it is safe without asking, or risky and why."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
# The case files are the tests' input, read at test time from the
# repository; a published crate does not carry them.
exclude = ["tests/cases/"]

[lints]
workspace = true

# docs.rs shows every guard, the opt-in `secrets` guard included.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["shell", "file", "url", "code", "script"]
# Judges a shell line: POSIX shell, PowerShell or cmd. The shell guard reads
# the Python, JavaScript and Ruby a line gives an interpreter inline with the code
# reader below; it is linked whether or not this front door shows it.
shell = ["dep:milo-guards-shell"]
# Reads Python, JavaScript and Ruby code, and says what it is certain to do
# or that it does not understand it.
code = ["dep:milo-guards-code", "milo-guards-code/ruby"]
# Judges one read or write of a path through a file API.
file = ["dep:milo-guards-file"]
# Judges Python, JavaScript or Ruby code an agent runs directly, with no shell
# line around it, with the code reader above.
script = ["dep:milo-guards-script"]
# Judges a URL an agent is about to fetch.
url = ["dep:milo-guards-url"]
# Reads a text for credentials and personal data. Not on by default: most
# callers want the shell, file and URL guards and not a table of patterns in
# their binary.
secrets = ["dep:milo-guards-secrets"]

[dependencies]
milo-guards-core.workspace = true
milo-guards-code = { workspace = true, optional = true }
milo-guards-shell = { workspace = true, optional = true }
milo-guards-file = { workspace = true, optional = true }
milo-guards-url = { workspace = true, optional = true }
milo-guards-secrets = { workspace = true, optional = true }
milo-guards-script = { workspace = true, optional = true }

[dev-dependencies]
# The test kit of the shell guard's test helpers, which `tests/everyday.rs`
# and `tests/everyday_answers.rs` share to run their case files.
milo-guards-core = { workspace = true, features = ["testing"] }
# What only the guards' own tests read: the count of what the shell guard's
# lexers and the code reader's parses are handed, and what judging code
# costs, which `tests/promises.rs` holds to their budgets, as the fuzz
# targets do (`tests/common/promises.rs`). Not for callers.
milo-guards-shell = { workspace = true, features = ["testing"] }
milo-guards-code = { workspace = true, features = ["testing"] }
milo-guards-script = { workspace = true, features = ["testing"] }
