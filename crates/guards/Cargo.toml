[package]
publish = false
name = "milo-local-guards"
description = "Guards for AI coding agents on your own machine: each reads what an agent is about to do and says whether it is safe without asking, or risky and why."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["shell", "file"]
# Judges a shell line: POSIX shell, PowerShell or cmd.
shell = ["dep:milo-guards-shell"]
# Judges one read or write of a path through a file API.
file = ["dep:milo-guards-file"]

[dependencies]
milo-guards-core.workspace = true
milo-guards-shell = { workspace = true, optional = true }
milo-guards-file = { workspace = true, optional = true }
