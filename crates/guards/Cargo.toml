[package]
publish = false
name = "milo-guards"
description = "Guards for AI coding agents on your own machine: each reads what an agent is about to do and says whether it is safe without asking, or risky and why."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["shell", "file", "url", "code"]
# Judges a shell line: POSIX shell, PowerShell or cmd. The shell guard reads
# the Python and JavaScript a line gives an interpreter inline with the code
# reader below; it is linked whether or not this front door shows it.
shell = ["dep:milo-guards-shell"]
# Reads Python and JavaScript code, and says what it is certain to do or that
# it does not understand it.
code = ["dep:milo-guards-code"]
# Judges one read or write of a path through a file API.
file = ["dep:milo-guards-file"]
# Judges a URL an agent is about to fetch.
url = ["dep:milo-guards-url"]
# Reads a text for credentials and personal data. Not on by default: most
# callers want the shell, file and URL guards and not a table of patterns in
# their binary.
secrets = ["dep:milo-guards-secrets"]

[dependencies]
milo-guards-core.workspace = true
milo-guards-code = { workspace = true, optional = true }
milo-guards-shell = { workspace = true, optional = true }
milo-guards-file = { workspace = true, optional = true }
milo-guards-url = { workspace = true, optional = true }
milo-guards-secrets = { workspace = true, optional = true }

[dev-dependencies]
# The test kit of the shell guard's test helpers, which `tests/everyday.rs`
# shares to run its case file.
milo-guards-core = { workspace = true, features = ["testing"] }
