[package]
name = "milo-guards-secrets"
description = "Reads a text and says whether it holds a credential (a key, a token, a password) or personal data, and where."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
# The case files are the tests' input, read at test time from the
# repository; a published crate does not carry them.
exclude = ["tests/cases/"]

[lints]
workspace = true

[dependencies]
milo-guards-core.workspace = true
# The table of credential shapes is a set of regular expressions. The crate
# matches in time linear in the text, which is the guard's promise on a
# hostile text. It is the guard's "own parser".
regex.workspace = true

[dev-dependencies]
milo-guards-core = { workspace = true, features = ["testing"] }
