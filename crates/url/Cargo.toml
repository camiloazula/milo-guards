[package]
publish = false
name = "milo-guards-url"
description = "Reads a URL an agent is about to fetch and says whether it is safe to fetch without asking, or risky and why."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
milo-guards-core.workspace = true
# The WHATWG URL parser: it reads every spelling of an address (decimal,
# octal, hex, shortened, IPv6-mapped, IDN) into one host, which is what the
# guard judges. Its tree is the guard's "own parsers".
url.workspace = true
percent-encoding.workspace = true

[dev-dependencies]
milo-guards-core = { workspace = true, features = ["testing"] }
