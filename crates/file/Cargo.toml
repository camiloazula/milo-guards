[package]
name = "milo-guards-file"
description = "Judges one read or write of a path through a file API and says whether it is safe without asking, or risky and why."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
# The case files are the tests' input, read at test time from the
# repository; a published crate does not carry them.
exclude = ["tests/cases/"]

[lints]
workspace = true

[dependencies]
milo-guards-core.workspace = true

[dev-dependencies]
milo-guards-core = { workspace = true, features = ["testing"] }
