[package]
name = "milo-guards-core"
description = "What every guard shares: the verdict types, the path model and the test kit."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
# The case files are the tests' input, read at test time from the
# repository; a published crate does not carry them.
exclude = ["tests/cases/"]

[lints]
workspace = true

[features]
# The table checker and the sample directories guards test themselves with.
testing = []


# The work counts are read through `testing`; core depends on nothing, so
# this test is built when the feature is on (`--all-features`, as the gate
# runs), and `cargo test -p milo-guards-core` builds the others as before.
[[test]]
name = "mount_work"
required-features = ["testing"]

[[test]]
name = "link_work"
required-features = ["testing"]

[[test]]
name = "climbing_work"
required-features = ["testing"]
