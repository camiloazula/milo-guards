[package]
name = "milo-guards-shell"
description = "Reads a shell command line (POSIX shell, PowerShell or cmd) and says whether it is safe to run without asking, or risky and why."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
# The case files are the tests' input, read at test time from the
# repository; a published crate does not carry them.
exclude = ["tests/cases/"]

[lints]
workspace = true

[features]
default = ["inline"]
# Reads the Python and JavaScript a line gives an interpreter inline
# (`python3 -c`, `node -e`, a here-document), with `milo-guards-code`. Off,
# the guard still finds such a line but reads none of the code: every inline
# line is `unknown`, and neither grammar is built.
inline = ["dep:milo-guards-code"]
# What only the guard's own tests read: the count of bytes its grammars'
# lexers are handed for a line (`MAX_LEXED` in `src/unit.rs`). Its tests turn
# it on, through the dev-dependency on this crate below. It is not for
# callers and not part of the API (hidden from the docs): it may change or
# go without notice.
testing = []

[dependencies]
milo-guards-core.workspace = true
milo-guards-code = { workspace = true, optional = true }
# The grammars and the runtime they share: the workspace manifest holds the
# runtime at 0.26 and says why.
tree-sitter.workspace = true
tree-sitter-bash.workspace = true
tree-sitter-powershell.workspace = true
tree-sitter-batch.workspace = true

[dev-dependencies]
milo-guards-core = { workspace = true, features = ["testing"] }
# This crate with `testing` on, so every build of its tests reads the count
# of what the grammars' lexers are handed (`tests/lexer_budget.rs`). Without
# its default features, so a build with `inline` off (`just no-inline`) keeps
# it off.
milo-guards-shell = { path = ".", default-features = false, features = ["testing"] }
